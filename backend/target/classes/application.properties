# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# Override all of these via environment variables — never hardcode credentials
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tufixit}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:22@Admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Use 'validate' in production to prevent accidental schema changes.
# Developers can set SPRING_JPA_DDL_AUTO=update in their local .env
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# JWT_SECRET must be set in production — minimum 32 characters
jwt.secret=${JWT_SECRET:4jMR3lMgKcYj1YhrddAPjgNtDvduYBdxZlR3y11zWRByWv7eV8J+/M8XRlAjlGRFY1a6z8y6Qy6o3+QcWGtwWw==}
# 30 minutes = 1800000ms
jwt.expiration=${JWT_EXPIRATION:1800000}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

