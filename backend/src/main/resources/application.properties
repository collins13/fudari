# Server Configuration
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tufixit}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:22@Admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:tufixit-secret-key-for-east-africa-m-pesa-integration-2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# M-Pesa Configuration
mpesa.consumer.key=${MPESA_CONSUMER_KEY:your_consumer_key}
mpesa.consumer.secret=${MPESA_CONSUMER_SECRET:your_consumer_secret}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY:your_passkey}
mpesa.callback.url=${MPESA_CALLBACK_URL:https://api.tufixit.com/mpesa/callback}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://tufixit.com}

# Africa's Talking SMS Configuration
# Set AT_API_KEY env var to enable live SMS. Leave blank to use log-only stub mode.
africastalking.api-key=${AT_API_KEY:}
africastalking.username=${AT_USERNAME:sandbox}
africastalking.sender-id=${AT_SENDER_ID:TUFIXIT}

# Logging
logging.level.com.tufixit=DEBUG
logging.level.org.springframework.security=INFO
