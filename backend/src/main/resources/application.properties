# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# Override all of these via environment variables — never hardcode credentials
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tufixit}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Use 'validate' in production to prevent accidental schema changes.
# Developers can set SPRING_JPA_DDL_AUTO=update in their local .env
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
# Introduced on a live schema that Hibernate created, so it baselines instead of
# trying to build from scratch. Hibernate still creates new entity tables; Flyway
# owns what Hibernate cannot express — indexes, backfills and constraint changes.
# Moving to ddl-auto=validate requires a generated baseline and is a follow-up.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# JWT Configuration
# The default below is a throwaway for local dev only — application-prod.properties
# requires JWT_SECRET to be supplied, so production cannot start without it.
jwt.secret=${JWT_SECRET:dev-only-insecure-signing-key-not-for-production-use-0123456789}
# 30 minutes = 1800000ms
jwt.expiration=${JWT_EXPIRATION:1800000}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# M-Pesa Configuration — set via environment variables
mpesa.consumer.key=${MPESA_CONSUMER_KEY:}
mpesa.consumer.secret=${MPESA_CONSUMER_SECRET:}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.callback.url=${MPESA_CALLBACK_URL:https://api.fudari.co/api/payments/mpesa/stk-callback}
# Daraja API base URL — use https://api.safaricom.co.ke for production
mpesa.base.url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://fudari.co}

# Africa's Talking SMS Configuration
# Set AT_API_KEY env var to enable live SMS. Leave blank to use log-only stub mode.
# Never commit a real key here — this file is in version control.
africastalking.api-key=${AT_API_KEY:}
africastalking.username=${AT_USERNAME:tufixit}
# An approved alphanumeric sender ID is REQUIRED for live traffic. Blank falls back to
# AT's default sender ID, which only delivers to Airtel Kenya numbers — Safaricom
# recipients are rejected with statusCode 406 UserInBlacklist.
africastalking.sender-id=${AT_SENDER_ID:}
# Set to "sandbox" for testing, "live" for production
africastalking.environment=${AT_ENVIRONMENT:live}

# WhatsApp Business Cloud API (Meta)
# Register webhook URL in Meta App Dashboard: https://api.fudari.co/api/whatsapp/webhook
# Docs: https://developers.facebook.com/docs/whatsapp/cloud-api
whatsapp.api.base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v19.0}
# From Meta App Dashboard > WhatsApp > Configuration > Phone Number ID
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
# Permanent system user access token (never the short-lived user token)
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN:}
# Set this in Meta App Dashboard > Webhooks > Verify Token — must match exactly
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:tufixit_whatsapp_verify_token}
# Meta App Secret for X-Hub-Signature-256 validation (from Meta App Dashboard > Settings > Basic)
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}

# Twilio WhatsApp Configuration
# Register webhook URLs in Twilio Console:
#   Inbound: https://api.fudari.co/api/whatsapp/twilio/inbound
#   Status:  https://api.fudari.co/api/whatsapp/twilio/status
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# Twilio WhatsApp sender number (e.g. whatsapp:+14155238886 for sandbox)
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:+14155238886}
# Validate Twilio webhook signatures (set to false for local dev without tunnel)
twilio.webhook.validate-signature=${TWILIO_VALIDATE_SIGNATURE:false}

# WhatsApp Provider Selection
# Options: "twilio" or "meta". Change this to switch providers without code changes.
whatsapp.provider=${WHATSAPP_PROVIDER:twilio}
# Enable fallback to the other provider if the primary fails
whatsapp.fallback.enabled=${WHATSAPP_FALLBACK_ENABLED:false}

# Subscription renewal scheduler
# Enable Spring's @Scheduled support
spring.task.scheduling.enabled=true

# OpenAI Configuration
# Set OPENAI_API_KEY environment variable — leave blank to run in stub/mock mode
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Logging
logging.level.com.tufixit=DEBUG
logging.level.org.springframework.security=INFO

# Mail (SMTP) — used for onboarding & transactional emails
spring.mail.host=${MAIL_HOST:mail.privateemail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:no-reply@fudari.co}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from-name=${MAIL_FROM_NAME:FUDARI}
mail.from-address=${MAIL_FROM_ADDRESS:no-reply@fudari.co}
mail.enabled=${MAIL_ENABLED:true}

# Public site URL used in outbound email links
app.base-url=${APP_BASE_URL:https://fudari.co}

# Rate limiting
rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
rate.limit.requests-per-minute=${RATE_LIMIT_RPM:60}
