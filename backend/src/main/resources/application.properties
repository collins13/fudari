# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tufixit
spring.datasource.username=postgres
spring.datasource.password=22@Admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=tufixit-secret-key-for-east-africa-m-pesa-integration-2024
jwt.expiration=86400000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# M-Pesa Configuration (Mock for development)
mpesa.consumer.key=your_consumer_key
mpesa.consumer.secret=your_consumer_secret
mpesa.shortcode=174379
mpesa.passkey=your_passkey
mpesa.callback.url=https://api.tufixit.com/mpesa/callback

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.tufixit=DEBUG
logging.level.org.springframework.security=INFO
