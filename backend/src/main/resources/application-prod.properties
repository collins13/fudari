# ═══════════════════════════════════════════════════════════════════════════
#  Production profile — activated with SPRING_PROFILES_ACTIVE=prod
#
#  Every value here is written WITHOUT a default. Spring fails to start if the
#  variable is missing, which is deliberate: a production boot that silently
#  falls back to a committed dev credential is worse than a boot that refuses.
# ═══════════════════════════════════════════════════════════════════════════

# ── Secrets: must come from the environment ────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
jwt.secret=${JWT_SECRET}
spring.data.redis.password=${REDIS_PASSWORD}

# ── Schema ─────────────────────────────────────────────────────────────────
# There is no Flyway/Liquibase on the classpath, so Hibernate owns the schema.
# `update` is required for the very first boot against an empty database; pin
# this to `validate` once the schema is settled so a bad entity change cannot
# silently rewrite production tables.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Webhook signature verification ─────────────────────────────────────────
# Unsigned webhooks let anyone forge inbound WhatsApp messages and bookings.
whatsapp.app-secret=${WHATSAPP_APP_SECRET}
twilio.webhook.validate-signature=${TWILIO_VALIDATE_SIGNATURE:true}

# ── Seeded admin ───────────────────────────────────────────────────────────
# DataSeeder still populates demo content in production, so these must be set
# to something private or the first admin account is publicly guessable.
seed.admin.email=${SEED_ADMIN_EMAIL}
seed.admin.password=${SEED_ADMIN_PASSWORD}

# ── Misc ───────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.base-url=${APP_BASE_URL}
mail.enabled=${MAIL_ENABLED:true}
rate.limit.enabled=${RATE_LIMIT_ENABLED:true}

logging.level.root=WARN
logging.level.com.tufixit=${LOGGING_LEVEL_COM_TUFIXIT:INFO}
logging.level.org.springframework.security=WARN

# Error responses must not leak stack traces or SQL to the client.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Nginx terminates TLS, so honour X-Forwarded-* when building absolute URLs.
server.forward-headers-strategy=NATIVE
