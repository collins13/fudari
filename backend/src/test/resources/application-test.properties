# Test configuration — uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:tufixit_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT
jwt.secret=test-secret-key-for-integration-tests-must-be-at-least-32-characters-long-base64
jwt.expiration=1800000

# Redis — disabled for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# CORS
cors.allowed-origins=http://localhost:3000

# M-Pesa — stub mode (empty keys)
mpesa.consumer.key=
mpesa.consumer.secret=
mpesa.shortcode=174379
mpesa.passkey=test-passkey
mpesa.callback.url=http://localhost:8080/api/payments/mpesa/stk-callback
mpesa.base.url=https://sandbox.safaricom.co.ke

# OpenAI — stub mode
openai.api-key=
openai.model=gpt-4o-mini

# Africa's Talking — stub mode
africastalking.api-key=
africastalking.username=sandbox
africastalking.sender-id=FUDARI

# WhatsApp — stub mode
whatsapp.api.base-url=https://graph.facebook.com/v19.0
whatsapp.api.phone-number-id=
whatsapp.api.access-token=
whatsapp.verify-token=test-verify-token

# Scheduling disabled in tests
spring.task.scheduling.enabled=false

# Rate limiting disabled in tests
rate.limit.enabled=false

# Logging
logging.level.com.tufixit=WARN
logging.level.org.springframework.security=WARN
