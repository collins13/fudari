# Bootstrap config — HTTP only.
#
# nginx.conf references Let's Encrypt certificates that do not exist before the
# first issuance, and nginx refuses to start when a referenced certificate is
# missing. Use this config for the initial `certbot certonly` run, then switch
# NGINX_CONF back to nginx.conf.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        listen [::]:80;
        server_name fudari.co www.fudari.co api.fudari.co;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'Fudari — awaiting TLS certificate issuance.\n';
            add_header Content-Type text/plain;
        }
    }
}
