events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 12m;   # matches spring.servlet.multipart.max-request-size
    keepalive_timeout    65;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    # Buckets are shared across workers; 10m holds roughly 160k addresses.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    upstream fudari_backend  { server backend:8080;  keepalive 32; }
    upstream fudari_frontend { server frontend:3000; keepalive 32; }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── ACME challenge + HTTPS redirect ────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name fudari.co www.fudari.co api.fudari.co;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── API: api.fudari.co ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.fudari.co;

        ssl_certificate     /etc/letsencrypt/live/fudari.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fudari.co/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Credential endpoints are the ones worth brute-forcing, so they get a
        # tighter bucket than the rest of the API.
        location ~ ^/api/auth/(login|register|forgot-password|reset-password|verify-otp) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://fudari_backend;
        }

        # Webhook signatures are verified in the app; buffering off keeps the
        # raw body intact for HMAC comparison.
        location /api/whatsapp/ {
            proxy_pass http://fudari_backend;
            proxy_request_buffering off;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://fudari_backend;
        }

        location /ws {
            proxy_pass http://fudari_backend;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location = /health {
            proxy_pass http://fudari_backend/api/health;
            access_log off;
        }

        location / { return 404; }
    }

    # ── Site: fudari.co (www redirects to apex) ────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.fudari.co;

        ssl_certificate     /etc/letsencrypt/live/fudari.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fudari.co/privkey.pem;

        return 301 https://fudari.co$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name fudari.co;

        ssl_certificate     /etc/letsencrypt/live/fudari.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fudari.co/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Hashed build assets are immutable, so they can be cached hard.
        location /_next/static/ {
            proxy_pass http://fudari_frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The service worker must never be cached or PWA updates never land.
        location = /sw.js {
            proxy_pass http://fudari_frontend;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            proxy_pass http://fudari_frontend;
        }
    }
}
