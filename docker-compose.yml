version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tufixit-postgres
    environment:
      POSTGRES_DB: tufixit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-22@Admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tufixit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tufixit-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/tufixit
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-22@Admin123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-tufixit-dev-secret-change-in-production}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://tufixit-frontend:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tufixit-frontend
    ports:
      - "3000:3000"
    environment:
      # Use Docker service name "backend" — localhost would refer to the container itself
      NEXT_PUBLIC_API_URL: http://backend:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
