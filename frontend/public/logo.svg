<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" role="img" aria-label="Fudari — Kenya's Services Marketplace">
  <defs>
    <linearGradient id="fudari-mark" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#157A83"/>
      <stop offset="1" stop-color="#0A4A50"/>
    </linearGradient>
  </defs>

  <!-- Mark: "F" monogram with an amber crossbar as the brand accent -->
  <g transform="translate(4 4) scale(0.83333)">
    <rect width="48" height="48" rx="13" fill="url(#fudari-mark)"/>
    <rect x="15" y="12" width="6.5" height="24" rx="3.25" fill="#ffffff"/>
    <rect x="15" y="12" width="18" height="6.5" rx="3.25" fill="#ffffff"/>
    <rect x="15" y="21.75" width="13" height="6.5" rx="3.25" fill="#FFB020"/>
  </g>

  <text x="54" y="31" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="0.5" fill="#12333A">FUDARI</text>

  <text x="55" y="43" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" letter-spacing="1.6" fill="#6C7F84">KENYA'S SERVICES MARKETPLACE</text>
</svg>
