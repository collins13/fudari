<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" role="img" aria-label="Fudari — Kenya's Services Marketplace">
  <!-- White lockup for dark backgrounds: the mark inverts to a solid white tile -->
  <g transform="translate(4 4) scale(0.83333)">
    <rect width="48" height="48" rx="13" fill="#ffffff"/>
    <rect x="15" y="12" width="6.5" height="24" rx="3.25" fill="#0D5C63"/>
    <rect x="15" y="12" width="18" height="6.5" rx="3.25" fill="#0D5C63"/>
    <rect x="15" y="21.75" width="13" height="6.5" rx="3.25" fill="#FFB020"/>
  </g>

  <text x="54" y="31" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="0.5" fill="#ffffff">FUDARI</text>

  <text x="55" y="43" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" letter-spacing="1.6" fill="rgba(255,255,255,0.72)">KENYA'S SERVICES MARKETPLACE</text>
</svg>
